name: Сборка APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи (если задан в секретах)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Сборка release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Подготовка APK
        id: apk
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)"/\1/p' app/build.gradle)
          NAME="IMS-for-Pixel-ru-${VERSION}-pixel9-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$APKSIGNER" verify --print-certs "$NAME" | head -n 3
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Публикация в Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version }}
          APK: ${{ steps.apk.outputs.name }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "IMS для Pixel $TAG (Pixel 9, Android 17)" \
            --notes "Русская версия IMS for Pixel. Сборка для Google Pixel 9 (arm64-v8a), Android 10–17.

          Коммит: $GITHUB_SHA
          SHA-256: \`$SHA256\`"
